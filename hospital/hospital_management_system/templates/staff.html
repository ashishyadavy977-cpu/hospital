{% extends "base.html" %}

{% block title %}Staff - MediCare Hospital{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Our Staff</h1>
        <p>Meet the dedicated professionals behind our hospital</p>
    </div>

    <section class="staff-management">
        <div class="management-header">
            <h2>Manage Staff</h2>
            <button class="btn btn-primary" id="addStaffBtn">+ Add Staff Member</button>
        </div>

        <!-- Add Staff Modal -->
        <div id="staffModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Add New Staff Member</h2>
                <form id="staffForm" enctype="multipart/form-data">
                    <div class="form-group">
                        <label>Full Name:</label>
                        <input type="text" id="staffName" required>
                    </div>
                    <div class="form-group">
                        <label>Position:</label>
                        <input type="text" id="staffPosition" required>
                    </div>
                    <div class="form-group">
                        <label>Department:</label>
                        <input type="text" id="staffDepartment" required>
                    </div>
                    <div class="form-group">
                        <label>Phone:</label>
                        <input type="tel" id="staffPhone">
                    </div>
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="staffEmail">
                    </div>
                    <div class="form-group">
                        <label>Photo:</label>
                        <input type="file" id="staffImage" accept="image/*">
                    </div>
                    <button type="submit" class="btn btn-primary">Add Staff</button>
                </form>
            </div>
        </div>

        <!-- Staff Grid -->
        <div class="staff-grid" id="staffGrid">
            <!-- Staff will be loaded here -->
        </div>
    </section>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    loadStaff();
    setupStaffForm();
    setupStaffModal();
});

function loadStaff() {
    fetch('/api/staff')
        .then(response => response.json())
        .then(data => {
            const grid = document.getElementById('staffGrid');
            grid.innerHTML = '';
            data.forEach(staff => {
                const imageUrl = staff.image ? `/static/images/${staff.image}` : '/static/images/staff-placeholder.jpg';
                const card = document.createElement('div');
                card.className = 'staff-card';
                card.innerHTML = `
                    <div class="staff-image">
                        <img src="${imageUrl}" alt="${staff.name}">
                    </div>
                    <div class="staff-info">
                        <h3>${staff.name}</h3>
                        <p class="position"><strong>${staff.position}</strong></p>
                        <p class="department"><i class="fas fa-building"></i> ${staff.department}</p>
                        <div class="staff-contact">
                            <p><i class="fas fa-phone"></i> ${staff.phone}</p>
                            <p><i class="fas fa-envelope"></i> ${staff.email}</p>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        });
}

function setupStaffForm() {
    document.getElementById('staffForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData();
        formData.append('name', document.getElementById('staffName').value);
        formData.append('position', document.getElementById('staffPosition').value);
        formData.append('department', document.getElementById('staffDepartment').value);
        formData.append('phone', document.getElementById('staffPhone').value);
        formData.append('email', document.getElementById('staffEmail').value);
        
        if (document.getElementById('staffImage').files.length > 0) {
            formData.append('image', document.getElementById('staffImage').files[0]);
        }
        
        fetch('/api/staff', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            alert('Staff member added successfully!');
            document.getElementById('staffModal').style.display = 'none';
            document.getElementById('staffForm').reset();
            loadStaff();
        });
    });
}

function setupStaffModal() {
    const modal = document.getElementById('staffModal');
    const btn = document.getElementById('addStaffBtn');
    const span = document.querySelector('#staffModal .close');
    
    btn.addEventListener('click', () => {
        modal.style.display = 'block';
    });
    
    span.addEventListener('click', () => {
        modal.style.display = 'none';
    });
    
    window.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.style.display = 'none';
        }
    });
}
</script>
{% endblock %}
