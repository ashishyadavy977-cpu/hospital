{% extends "base.html" %}
{% block title %}Reset Password - MediCare Hospital{% endblock %}
{% block content %}
<div class="auth-container"><div class="auth-box">
<h1>Reset Password</h1>
<form method="POST" class="auth-form">
<div class="form-group"><label>New Password</label><input type="password" name="password" minlength="6" required></div>
<div class="form-group"><label>Confirm Password</label><input type="password" name="confirm_password" minlength="6" required></div>
<button class="btn btn-primary btn-block" type="submit">Reset Password</button>
</form>
</div></div>
{% endblock %}
