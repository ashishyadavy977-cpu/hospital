{% extends "base.html" %}
{% block title %}Forgot Password - MediCare Hospital{% endblock %}
{% block content %}
<div class="auth-container"><div class="auth-box">
<h1>Forgot Password</h1>
<form method="POST" class="auth-form">
<div class="form-group"><label>Account Email</label><input type="email" name="email" required></div>
<button class="btn btn-primary btn-block" type="submit">Generate Reset Link</button>
</form>
{% if reset_link %}<p class="alert alert-info">Development reset link:</p><p><a href="{{ reset_link }}">Reset Password</a></p>{% endif %}
<p class="auth-link"><a href="{{ url_for('login') }}">Back to login</a></p>
</div></div>
{% endblock %}
